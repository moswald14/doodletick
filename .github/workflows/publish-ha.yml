name: Publish checked Home Assistant images

on:
  push:
    tags: ['0.*b']

permissions: {}

concurrency:
  group: ha-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'push' && github.repository == 'moswald14/doodletick' && github.event.repository.fork == false && github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the release guard runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact-SHA checks and promote matching immutable manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ha-image-release.mjs promote
