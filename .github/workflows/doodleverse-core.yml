name: Build experimental Doodleverse Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doodleverse-core/**'
      - '.github/workflows/doodleverse-core.yml'
  pull_request:
    paths:
      - 'doodleverse-core/**'
      - '.github/workflows/doodleverse-core.yml'

permissions:
  contents: read

concurrency:
  group: doodleverse-core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux wallet and isolated regtest checks
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out build integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux compiler and distribution libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential autoconf automake libtool pkg-config python3 git ca-certificates libssl-dev libevent-dev libdb5.3++-dev libboost-system-dev libboost-filesystem-dev libboost-chrono-dev libboost-program-options-dev libboost-test-dev libboost-thread-dev
      - name: Build fixed source and test disposable regtest
        run: bash doodleverse-core/scripts/build-linux.sh 2>&1 | tee doodleverse-core/build-linux.log
      - name: Preserve the tested Linux package and corresponding source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doodleverse-core-experimental-linux-x86_64
          path: doodleverse-core/dist/linux-x86_64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doodleverse-core-linux-build-log
          path: doodleverse-core/build-linux.log
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Experimental Windows wallet cross-build
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the same build integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential autoconf automake libtool pkg-config python3 git ca-certificates curl bison patch perl zip g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix
      - name: Cross-compile fixed source with verified dependency archives
        run: bash doodleverse-core/scripts/build-windows.sh 2>&1 | tee doodleverse-core/build-windows.log
      - name: Preserve Windows package and corresponding dependency sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doodleverse-core-experimental-windows-x86_64
          path: doodleverse-core/dist/windows-x86_64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve cross-build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doodleverse-core-windows-build-log
          path: doodleverse-core/build-windows.log
          if-no-files-found: ignore
          retention-days: 7
