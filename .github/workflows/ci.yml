name: Validate Doodle Tick

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release metadata and generated runtime
        run: node scripts/check-repository.mjs
      - name: Install pinned recipient verification build tools
        working-directory: crypto-vendor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce recipient signature bundle and sources
        working-directory: crypto-vendor
        run: |
          npm run check
          node build-scrypt-wallet.mjs --check
      - name: Run Keeper and Home Assistant tests
        run: node scripts/test.mjs
      - name: Install pinned contract verification tools
        working-directory: contracts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce public garden bytecode
        working-directory: contracts
        run: npm run check
      - name: Test the public garden in a local EVM
        working-directory: contracts
        run: npm test
