name: Validate Doodle Tick

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release metadata and generated runtime
        run: node scripts/check-repository.mjs
      - name: Install pinned recipient verification build tools
        working-directory: crypto-vendor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce recipient signature bundle and sources
        working-directory: crypto-vendor
        run: |
          npm run check
          node build-scrypt-wallet.mjs --check
      - name: Run Keeper and Home Assistant tests
        run: node scripts/test.mjs
      - name: Install pinned contract verification tools
        working-directory: contracts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce public garden bytecode
        working-directory: contracts
        run: npm run check
      - name: Test the public garden in a local EVM
        working-directory: contracts
        run: npm test

  jazz-native:
    name: Jazz audio · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Home Assistant image with pinned native audio
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --tag doodletick-jazz-check doodletick
      - name: Send and decode original PCM through native Opus and check offline voice
        run: timeout 120s docker run --rm --volume "$PWD/scripts:/opt/doodletick/scripts:ro" --entrypoint node doodletick-jazz-check scripts/check-jazz-native.mjs
      - name: Check the real monitor encoder, keepsake audio and offline voice
        run: timeout 120s docker run --rm --volume "$PWD/scripts:/opt/doodletick/scripts:ro" --entrypoint node doodletick-jazz-check scripts/check-jazz-media.mjs
