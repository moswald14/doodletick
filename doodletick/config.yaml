name: Doodle Tick Keeper
version: "0.18b"
image: "ghcr.io/moswald14/doodletick-{arch}"
slug: doodletick
description: Creator vault, native DVC mining and payments, garden and direct peer arcade
url: https://github.com/moswald14/doodletick
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
stage: experimental
backup: cold
timeout: 60
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:palette-outline
panel_title: Doodle Tick
panel_admin: true
watchdog: "http://[HOST]:8099/health"
host_network: false
ports:
  38474/tcp: null
ports_description:
  38474/tcp: Optional Doodleverse mainnet peers; RPC stays private
apparmor: true
map:
  - type: app_config
    read_only: true
options:
  hostname: doodletick-ha
  dvc_node_enabled: true
  dvc_network: main
  dvc_listen: true
  dvc_peers: []
  mozcorp_ai_enabled: false
  mozcorp_openai_model: gpt-5-mini
  jazz_enabled: false
  jazz_recipient: "0x88bB0e5353EBF7b93DD3745799bDc2d8F812527f"
  jazz_openai_api_key: ""
  jazz_daily_limit: 30
schema:
  hostname: "match(^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$)"
  dvc_node_enabled: bool
  dvc_network: "list(main|test|regtest)"
  dvc_listen: bool
  dvc_peers:
    - str
  mozcorp_ai_enabled: bool
  mozcorp_openai_model: "match(^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,79}$)"
  mozcorp_openai_api_key: "password?"
  jazz_enabled: bool
  jazz_recipient: "str?"
  jazz_openai_api_key: "password?"
  jazz_daily_limit: "int(3,1000)"
